<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Microphone Body Gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Shape (Squircle Windows Style) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#312e81" stroke-width="6" />

  <!-- Background Controller Soundwave Bars -->
  <g opacity="0.35" fill="url(#neonGrad)">
    <rect x="90" y="260" width="24" height="110" rx="12" />
    <rect x="130" y="200" width="24" height="170" rx="12" />
    <rect x="170" y="150" width="24" height="220" rx="12" />
    <rect x="318" y="150" width="24" height="220" rx="12" />
    <rect x="358" y="200" width="24" height="170" rx="12" />
    <rect x="398" y="260" width="24" height="110" rx="12" />
  </g>

  <!-- Center Microphone Head -->
  <path d="M256 120 C210 120 180 155 180 205 L180 260 C180 300 210 330 256 330 C302 330 332 300 332 260 L332 205 C332 155 302 120 256 120 Z" 
        fill="url(#neonGrad)" filter="url(#glow)" />

  <!-- Microphone Mesh Pattern Lines -->
  <path d="M190 190 H322 M185 220 H327 M185 250 H327 M190 280 H322" 
        stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Microphone Handle Base -->
  <path d="M226 330 L236 410 C238 420 246 428 256 428 C266 428 274 420 276 410 L286 330 Z" 
        fill="url(#micGrad)" />

  <!-- Sliders / Equalizer Knobs (Controller Theme Accent) -->
  <circle cx="142" cy="240" r="16" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="370" cy="290" r="16" fill="#c084fc" filter="url(#glow)" />

  <!-- Music Note Sparkle -->
  <path d="M380 100 Q400 100 400 80 Q400 100 420 100 Q400 100 400 120 Q400 100 380 100 Z" fill="#f43f5e" />
  <path d="M100 130 Q115 130 115 115 Q115 130 130 130 Q115 130 115 145 Q115 130 100 130 Z" fill="#38bdf8" />
</svg>
